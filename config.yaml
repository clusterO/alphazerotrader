trading:
  symbol: "BTC/USDT"
  timeframe: "1h"
  data_path: "data/stable"
  window_size: 60
  initial_balance: 1000
  testnet: true
  fee: 0.0001
  tanh_scale: 3.0 
  drawdown_threshold: 0.15 
  idling_penalty: 0.00005
  episode_length_range: [150, 400]

rl:
  episodes: 30
  use_world_model: true 
  skip_tournament: false
  mcts_sims: 600 
  mcts_batch_size: 16 
  mcts_max_depth: 2000 
  warmup_iterations: 0
  warmup_tau: 1.0
  memory_size: 100000 
  tau_decay: 0.99
  tau_min: 0.1 
  cpuct: 0.35
  epsilon: 0.3 
  alpha: 0.3 
  batch_size: 256
  epochs: 1
  learning_rate: 0.0001 
  lr_decay: 0.99 
  training_loops: 100

model:
  type: "transformer"
  d_model: 64
  num_heads: 4
  num_layers: 2
  dropout: 0.1

evaluation:
  eval_episodes: 20 
  scoring_threshold: 1.05 
  metric: "sharpe" 
