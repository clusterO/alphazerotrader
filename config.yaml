trading:
  symbol: "BTC/USDT"
  timeframe: "1h"
  window_size: 60
  initial_balance: 1000
  fee: 0.0005 # 5 bps
  tanh_scale: 10.0 # Maps small % changes to significant value targets
  episode_length_range: [150, 400]

rl:
  episodes: 30
  mcts_sims: 100 
  mcts_batch_size: 16 
  mcts_max_depth: 1000 
  memory_size: 30000
  turns_until_tau0: 10
  cpuct: 1.0
  epsilon: 0.2
  alpha: 0.8
  batch_size: 256
  epochs: 1
  learning_rate: 0.0001 
  momentum: 0.9
  training_loops: 100

model:
  type: "transformer"
  d_model: 64
  num_heads: 4
  num_layers: 2
  dropout: 0.1

evaluation:
  eval_episodes: 30 # Increased for statistical rigor (Phase 5.5)
  scoring_threshold: 1.1 
  metric: "sharpe" 
